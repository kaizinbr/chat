<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Operadores e Fila</title>
    <style>
        :root {

            --muted: #BDBDBD;
            --accent: #2de0a5;
            --accent-dim: rgba(45, 224, 165, 0.1);
            --danger: #f5455c;
            --danger-dim: rgba(245, 69, 92, 0.1);
            --warn: #f5a623;
--bg: #282828;
--text: #FFFFFF;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .hidden { display: none; }
        /* ========== LOGIN ========== */
        .login-section {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-box {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 36px;
            width: 100%;
            max-width: 380px;
        }
        .login-box h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
            color: var(--accent);
        }
        .login-box p {
            color: var(--muted);
            font-size: 13px;
            text-align: center;
            margin-bottom: 28px;
        }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
            letter-spacing: 0.4px;
        }
        .form-group input {
            width: 100%;
            padding: 11px 12px;
            background-color: #242424;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .form-group input::placeholder { color: #666; }
        .login-btn {
            width: 100%;
            padding: 11px;
            background-color: var(--accent);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 6px;
        }
        .login-btn:hover:not(:disabled) { background-color: #24c791; }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .login-error {
            background-color: var(--danger-dim);
            border: 1px solid rgba(245, 69, 92, 0.3);
            color: #f5a5b8;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 14px;
            display: none;
        }
        .login-error.show { display: block; }
        /* ========== HEADER ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding: 16px 20px;
            background-color: var(--surface);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .header h1 { font-size: 22px; color: var(--accent); font-weight: 700; }
        .user-info { display: flex; align-items: center; gap: 14px; }
        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--accent);
        }
        .user-details { display: flex; flex-direction: column; }
        .user-name { font-weight: 600; font-size: 14px; }
        .user-status {
            font-size: 12px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .dot.online { background-color: var(--accent); }
        .dot.away { background-color: var(--warn); }
        .dot.busy { background-color: var(--danger); }
        .dot.offline { background-color: #BDBDBD; }
        .chat-icon { color: var(--accent); }
        .chat-icon.disabled { color: #BDBDBD; }
        .logout-btn {
            padding: 7px 14px;
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--danger);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .logout-btn:hover { border-color: var(--danger); background-color: var(--danger-dim); }
        /* ========== STATS ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }
        .stat-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 10px;
            letter-spacing: 0.6px;
        }
        .stat-value {
            font-size: 36px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 4px;
            line-height: 1;
        }
        .stat-card.queue .stat-value { color: var(--danger); }
        .stat-subtitle { font-size: 12px; color: #777; }
        /* ========== AGENTS ========== */
        .agents-section {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }
        .agents-section h2 { font-size: 16px; margin-bottom: 16px; font-weight: 600; }
        .sort-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .sort-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            background-color: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #ccc;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
        }
        .sort-btn:hover { border-color: var(--border-hover); }
        .sort-btn.active { border-color: var(--accent); color: var(--accent); background-color: var(--accent-dim); }
        .agents-list { display: grid; gap: 8px; }
        .agent-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            background-color: #383838;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .agent-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }
        .agent-info { flex: 1; min-width: 0; }
        .agent-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
        }
        .agent-n2-badge {
            background-color: #9b59b6;
            color: white;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 700;
        }
        .agent-dept-count { font-size: 11.5px; color: #777; font-weight: 400; }
        .agent-status {
            font-size: 12.5px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .agent-chat-count {
            text-align: center;
            flex-shrink: 0;
            min-width: 50px;
        }
        .agent-chat-count-number {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            line-height: 1.1;
        }
        .agent-chat-count-label {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .empty-state { text-align: center; padding: 32px 20px; color: #777; }
        .empty-state-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.5; }
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #333;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
	.icon {
		background: white;
	}
	svg {
		display: inline-block;
		width: 20px;
		height: 20px;
		color: blue;
}
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { display: flex; align-items: center; justify-content: center; gap: 8px; color: #999; font-size: 13px; }
        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 16px; text-align: center; }
            .user-info { justify-content: center; }
            .agent-row { flex-direction: column; text-align: center; }
            .agent-info { width: 100%; }
            .agent-status, .agent-name { justify-content: center; }
            .stat-value { font-size: 30px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGIN SECTION -->
        <div id="login-section" class="login-section">
            <div class="login-box">
                <h1>Rocket.Chat</h1>
                <p>Dashboard - Operadores e Fila</p>
                <div id="login-error" class="login-error"></div>
                <div class="form-group">
                    <label>Servidor</label>
                    <input type="text" id="api-url" placeholder="https://helptechho.digitalaec.com.br" value="https://helptechho.digitalaec.com.br">
                </div>
                <div class="form-group">
                    <label>Usuário</label>
                    <input type="text" id="username" placeholder="Seu usuário" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="password" placeholder="Sua senha" autocomplete="current-password">
                </div>
                <button id="login-btn" class="login-btn">Entrar</button>
            </div>
        </div>
        <!-- DASHBOARD SECTION -->
        <div id="dashboard-section" class="hidden">
            <div class="header">
                <h1>Dashboard</h1>
                <div class="user-info">
                    <div class="user-avatar" id="user-avatar">JS</div>
                    <div class="user-details">
                        <div class="user-name" id="user-name">Carregando...</div>
                        <div class="user-status">
                            <span class="dot online" id="status-dot"></span>
                            <span id="user-status">Online</span>
                        </div>
                    </div>
                    <button class="logout-btn" id="logout-btn">Sair</button>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-card queue">
                    <div class="stat-label">CRs em Fila</div>
                    <div class="stat-value" id="queue-count">—</div>
                    <div class="stat-subtitle">Aguardando atendimento</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total de Agentes</div>
                    <div class="stat-value" id="total-agents">0</div>
                    <div class="stat-subtitle">Mais de 12 filas (inclui deslogados)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Disponíveis</div>
                    <div class="stat-value" id="available-agents">0</div>
                    <div class="stat-subtitle">Pronto para atender</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Agentes Online</div>
                    <div class="stat-value" id="online-agents">0</div>
                    <div class="stat-subtitle">Logados no Rocket.Chat</div>
                </div>
            </div>
            <div class="agents-section">
                <h2>Operadores Logados</h2>
                <div class="sort-controls">
                    <button id="sort-chats-btn" class="sort-btn">Atendimentos <span class="sort-arrow">↕</span></button>
                    <button id="sort-unavailable-btn" class="sort-btn">Indisponíveis</button>
                    <button id="sort-alpha-btn" class="sort-btn">A-Z <span class="sort-arrow">↕</span></button>
                </div>
                <div class="agents-list" id="agents-list">
                    <div class="loading-text">
                        <div class="loading-spinner"></div>
                        Carregando operadores...
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // ================================================================
        // Constants
        // ================================================================
        const N2_DEPT = 'AgPki67wjCZpN5X2W';
        const QUEUE_AGENT_ID = '2p7YLxPWbNHSkurQ9'; // agente/bot que recebe os CRs em fila
        const MIN_DEPARTMENTS = 10;
        const TOTAL_MIN_DEPARTMENTS = 12; // usado só no card "Total de Agentes" (inclui deslogados)
        const AGENT_PALETTE = [
            '#7c4dff', '#3d8bff', '#26a69a', '#ec407a', '#ab47bc',
            '#5c6bc0', '#42a5f5', '#26c6da', '#66bb6a', '#ffa726',
        ];
        // ================================================================
        // State
        // ================================================================
        const state = {
            apiUrl: 'https://helptechho.digitalaec.com.br',
            token: null,
            userId: null,
            me: null,
            userStatus: 'offline',
            queueCount: '—',
            agents: [],
            roomsByAgent: new Map(),
            totalQualifiedAgents: 0,
            sortMode: 'default',
            chatsSortDir: 'desc',
            alphaSortDir: 'asc',
            updateIntervals: []
        };
        // ================================================================
        // Helpers
        // ================================================================
        function pickColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return AGENT_PALETTE[Math.abs(hash) % AGENT_PALETTE.length];
        }
        function initials(name) {
            return name.split(' ').slice(0, 2).map(n => n[0]).join('').toUpperCase();
        }
        function isN2(agent) {
            return Array.isArray(agent.departments) && agent.departments.some(d => (d._id || d) === N2_DEPT);
        }
        function statusLabel(status) {
            const labels = {
                online: 'Disponível', away: 'Ausente', away_almoco: 'Pausa Almoço',
                away_feedback: 'Pausa Feedback', busy: 'Ocupado', offline: 'Deslogado'
            };
            return labels[status] || status;
        }
        function statusDotClass(status) {
            if (status === 'online' || status === 'available') return 'online';
            if (status === 'away' || status === 'away_almoco' || status === 'away_feedback') return 'away';
            if (status === 'busy') return 'busy';
            return 'offline';
        }
        // dot do card de operador reflete se ele ACEITA novos chats (statusLivechat), não a presença bruta
        function livechatDotClass(agent) {
            return agent.statusLivechat === 'available' ? 'online' : 'busy';
        }
        function agentRank(agent) {
            const av = agent.statusLivechat === 'available';
            const on = agent.status === 'online';
            const n2 = isN2(agent);
            const offlineAndUnavailable = agent.status === 'offline' && !av;
            if (offlineAndUnavailable) return 6;
            if (n2 && av && on) return 0;
            if (av && on) return 1;
            if (n2 && av) return 2;
            if (av) return 3;
            if (n2) return 4;
            return 5;
        }
        function sortAgents(agents) {
            const list = [...agents];
            switch (state.sortMode) {
                case 'chats': {
                    const dir = state.chatsSortDir === 'asc' ? 1 : -1;
                    list.sort((a, b) => {
                        const ca = state.roomsByAgent.get(a._id) || 0;
                        const cb = state.roomsByAgent.get(b._id) || 0;
                        return (ca - cb) * dir;
                    });
                    break;
                }
                case 'unavailable': {
                    list.sort((a, b) => {
                        const aAv = a.statusLivechat === 'available' ? 1 : 0;
                        const bAv = b.statusLivechat === 'available' ? 1 : 0;
                        if (aAv !== bAv) return aAv - bAv;
                        return (a.name || a.username).localeCompare(b.name || b.username, 'pt-BR');
                    });
                    break;
                }
                case 'alpha': {
                    const dir = state.alphaSortDir === 'asc' ? 1 : -1;
                    list.sort((a, b) => (a.name || a.username).localeCompare(b.name || b.username, 'pt-BR') * dir);
                    break;
                }
                default:
                    list.sort((a, b) => agentRank(a) - agentRank(b));
            }
            return list;
        }
        function updateSortButtonsUI() {
            const chatsBtn = document.getElementById('sort-chats-btn');
            const unavBtn = document.getElementById('sort-unavailable-btn');
            const alphaBtn = document.getElementById('sort-alpha-btn');
            chatsBtn.classList.toggle('active', state.sortMode === 'chats');
            unavBtn.classList.toggle('active', state.sortMode === 'unavailable');
            alphaBtn.classList.toggle('active', state.sortMode === 'alpha');
            chatsBtn.querySelector('.sort-arrow').textContent = state.sortMode === 'chats' ? (state.chatsSortDir === 'asc' ? '↑' : '↓') : '↕';
            alphaBtn.querySelector('.sort-arrow').textContent = state.sortMode === 'alpha' ? (state.alphaSortDir === 'asc' ? 'A→Z' : 'Z→A') : '↕';
        }
        async function sha256hex(text) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
        }
        // ================================================================
        // API
        // ================================================================
        async function performLogin(apiUrl, username, digest) {
            const response = await fetch(apiUrl + '/api/v1/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user: username, password: { digest, algorithm: 'sha-256' } })
            });
            if (!response.ok) throw new Error('Usuário ou senha inválidos');
            const data = await response.json();
            return { token: data.data.authToken, userId: data.data.userId };
        }
        async function login(username, password) {
            const digest = await sha256hex(password);
            const { token, userId } = await performLogin(state.apiUrl, username, digest);
            state.token = token;
            state.userId = userId;
            // Guardamos o digest (não a senha em texto puro) para poder refazer o login
            // sozinho quando o token (validade de 1 dia) expirar.
            localStorage.setItem('rc_token', token);
            localStorage.setItem('rc_userId', userId);
            localStorage.setItem('rc_apiUrl', state.apiUrl);
            localStorage.setItem('rc_username', username);
            localStorage.setItem('rc_pwdigest', digest);
        }
        // Reautentica usando as credenciais salvas. Retorna true/false.
        async function reAuthenticate() {
            const username = localStorage.getItem('rc_username');
            const digest = localStorage.getItem('rc_pwdigest');
            const apiUrl = localStorage.getItem('rc_apiUrl') || state.apiUrl;
            if (!username || !digest) return false;
            try {
                const { token, userId } = await performLogin(apiUrl, username, digest);
                state.token = token;
                state.userId = userId;
                state.apiUrl = apiUrl;
                localStorage.setItem('rc_token', token);
                localStorage.setItem('rc_userId', userId);
                return true;
            } catch (error) {
                console.error('Falha ao reautenticar automaticamente:', error);
                return false;
            }
        }
        async function apiGet(path, allowRetry = true) {
            try {
                const response = await fetch(state.apiUrl + path, {
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Auth-Token': state.token || '',
                        'X-User-Id': state.userId || ''
                    }
                });
                if (response.status === 401) {
                    if (allowRetry) {
                        const ok = await reAuthenticate();
                        if (ok) return apiGet(path, false);
                    }
                    logout();
                    return null;
                }
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                return null;
            }
        }
        // ================================================================
        // Data Loading
        // ================================================================
        async function loadMe() {
            const data = await apiGet('/api/v1/me');
            if (data) {
                state.me = data;
                state.userStatus = data.status || 'offline';
                updateUserUI();
            }
        }
        async function loadQueueCount() {
            try {
                const d = await apiGet(`/api/v1/livechat/queue?agentId=${QUEUE_AGENT_ID}`);
                state.queueCount = d?.queue?.[0]?.chats ?? '—';
                document.getElementById('queue-count').textContent = state.queueCount;
            } catch (error) {
                console.error('Erro ao carregar fila:', error);
                state.queueCount = '—';
                document.getElementById('queue-count').textContent = '—';
            }
        }
        async function loadRoomsByAgent() {
            try {
                let allEntries = [];
                let offset = 0;
                const pageSize = 100;
                let total = Infinity;
                while (offset < total) {
                    const d = await apiGet(`/api/v1/livechat/queue?count=${pageSize}&offset=${offset}&includeOfflineAgents=true`);
                    if (!d || !d.queue) break;
                    allEntries = allEntries.concat(d.queue);
                    total = d.total ?? allEntries.length;
                    offset += pageSize;
                    if (d.queue.length === 0) break;
                }
                const counts = new Map();
                allEntries.forEach(entry => {
                    const agentId = entry.user?._id;
                    const chats = entry.chats || 0;
                    if (agentId) counts.set(agentId, (counts.get(agentId) || 0) + chats);
                });
                state.roomsByAgent = counts;
            } catch (error) {
                console.error('Erro ao carregar salas por agente:', error);
                state.roomsByAgent = new Map();
            }
        }
        async function loadAgents() {
            try {
                const data = await apiGet('/api/v1/livechat/users/agent?count=200&offset=0');
                if (!data || !data.users) throw new Error('Sem dados');
                await loadRoomsByAgent();
                state.totalQualifiedAgents = data.users.filter(u =>
                    Array.isArray(u.departments) && u.departments.length > TOTAL_MIN_DEPARTMENTS && u.username !== 'fila.chat'
                ).length;
                const filtered = data.users.filter(u =>
                    Array.isArray(u.departments) && u.departments.length > MIN_DEPARTMENTS &&
                    !(u.status === 'offline' && u.statusLivechat !== 'available') && u.username !== 'fila.chat'
                );
                state.agents = sortAgents(filtered);
                renderAgents();
                updateStats();
            } catch (error) {
                console.error('Erro ao carregar agentes:', error);
                document.getElementById('agents-list').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div>Erro ao carregar agentes</div></div>';
            }
        }
        // ================================================================
        // UI Updates
        // ================================================================
        function updateUserUI() {
            if (!state.me) return;
            const name = state.me.name || state.me.username;
            document.getElementById('user-avatar').textContent = initials(name);
            document.getElementById('user-name').textContent = name;
            document.getElementById('user-status').textContent = statusLabel(state.userStatus);
		console.log(statusDotClass(state.userStatus))
            document.getElementById('status-dot').className = 'dot ' + statusDotClass(state.userStatus);
        }
        function updateStats() {
            document.getElementById('total-agents').textContent = state.totalQualifiedAgents;
            document.getElementById('available-agents').textContent = state.agents.filter(a => a.statusLivechat === 'available').length;
            document.getElementById('online-agents').textContent = state.agents.filter(a => a.status === 'online').length;
        }
        function renderAgents() {
            const list = document.getElementById('agents-list');
            if (state.agents.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👤</div><div>Nenhum agente logado</div></div>';
                return;
            }
            list.innerHTML = state.agents.map(agent => {
                const name = (agent.name || agent.username || '?').trim();
                const ini = initials(name);
                const bg = pickColor(agent.username);
                const label = statusLabel(agent.status || 'offline');

                const balloonLabel = agent.statusLivechat === 'available' ? 'Balão aberto' : 'Balão fechado';

const chatIcon = agent.statusLivechat === 'available'
    ? `<svg xmlns="http://www.w3.org/2000/svg"
            width="16" height="16" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" aria-hidden="true"
            class="chat-icon">
           <path d="M12 22C17.52 22 22 17.52 22 12S17.52 2 12 2 2 6.48 2 12c0 1.6.38 3.11 1.04 4.45.18.36.24.77.14 1.15l-.6 2.23c-.26.97.63 1.85 1.59 1.59l2.23-.6c.38-.1.79-.04 1.15.14A9.96 9.96 0 0 0 12 22Z"/>
       </svg>`
    : `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="1.5" class="solar solar-chat-round-off-linear chat-icon disabled"><path d="M4.92915 4.92969C3.1195 6.73933 2.00021 9.23933 2.00021 12.0008C2.00021 13.6004 2.37583 15.1124 3.04367 16.4532C3.22115 16.8095 3.28022 17.2168 3.17733 17.6014L2.58172 19.8274C2.32317 20.7937 3.20723 21.6778 4.17356 21.4192L6.3996 20.8236C6.78415 20.7207 7.19142 20.7798 7.54774 20.9573C8.88858 21.6251 10.4005 22.0008 12.0002 22.0008C14.7616 22.0008 17.2616 20.8815 19.0713 19.0718" stroke="currentColor" stroke-linecap="round"/>
<path d="M6.862 3.41914C8.36362 2.51807 10.1213 2 12 2C17.5228 2 22 6.47715 22 12C22 13.8787 21.4819 15.6364 20.5809 17.138" stroke="currentColor" stroke-linecap="round"/>
<path d="M2 2C2.97631 2.97631 3.95262 3.95262 4.92893 4.92893C5.21199 5.21199 5.49505 5.49505 5.77811 5.77811C7.06458 7.06458 8.35106 8.35106 9.63753 9.63753C12.782 12.782 15.9266 15.9266 19.0711 19.0711C20.0474 20.0474 21.0237 21.0237 22 22" stroke="currentColor" stroke-linecap="round"/></svg>`;

                const deptCount = (agent.departments || []).length;
                const roomCount = state.roomsByAgent.get(agent._id) || 0;
                return `
                    <div class="agent-row">
                        <div class="agent-avatar" style="background-color: ${bg}">${ini}</div>
                        <div class="agent-info">
                            <div class="agent-name">
                                ${name}
                                ${isN2(agent) ? '<span class="agent-n2-badge">N2</span>' : ''}
                                <span class="agent-dept-count">${deptCount} filas</span>
                            </div>
                            <div class="agent-status">${chatIcon}<span>${balloonLabel}</span><span class="dot ${statusDotClass(agent.status)}"></span><span>${label}</span></div>
                        </div>
                        <div class="agent-chat-count">
                            <div class="agent-chat-count-number">${roomCount}</div>
                            <div class="agent-chat-count-label">Atend.</div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        function showLoginPage() {
            document.getElementById('login-section').style.display = 'flex';
            document.getElementById('dashboard-section').classList.add('hidden');
        }
        async function showDashboard() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-section').classList.remove('hidden');
            state.updateIntervals.forEach(id => clearInterval(id));
            state.updateIntervals = [];
            await loadMe();
            await loadQueueCount();
            await loadAgents();
            const interval = setInterval(async () => {
                await loadQueueCount();
                await loadAgents();
            }, 10000);
            state.updateIntervals.push(interval);
        }
        function logout() {
            state.token = null;
            state.userId = null;
            state.me = null;
            state.queueCount = '—';
            state.updateIntervals.forEach(id => clearInterval(id));
            state.updateIntervals = [];
            localStorage.removeItem('rc_token');
            localStorage.removeItem('rc_userId');
            localStorage.removeItem('rc_apiUrl');
            localStorage.removeItem('rc_username');
            localStorage.removeItem('rc_pwdigest');
            showLoginPage();
        }
        // ================================================================
        // Events
        // ================================================================
        document.getElementById('login-btn').addEventListener('click', async () => {
            const apiUrl = document.getElementById('api-url').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');
            if (!apiUrl || !username || !password) {
                errorDiv.textContent = 'Preencha todos os campos';
                errorDiv.classList.add('show');
                return;
            }
            try {
                state.apiUrl = apiUrl;
                btn.disabled = true;
                btn.textContent = 'Entrando...';
                errorDiv.classList.remove('show');
                await login(username, password);
                showDashboard();
            } catch (error) {
                errorDiv.textContent = error.message || 'Erro ao fazer login';
                errorDiv.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        });
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('login-btn').click();
        });
        document.getElementById('logout-btn').addEventListener('click', logout);
        document.getElementById('sort-chats-btn').addEventListener('click', () => {
            if (state.sortMode === 'chats') {
                state.chatsSortDir = state.chatsSortDir === 'asc' ? 'desc' : 'asc';
            } else {
                state.sortMode = 'chats';
                state.chatsSortDir = 'desc';
            }
            state.agents = sortAgents(state.agents);
            updateSortButtonsUI();
            renderAgents();
        });
        document.getElementById('sort-unavailable-btn').addEventListener('click', () => {
            state.sortMode = state.sortMode === 'unavailable' ? 'default' : 'unavailable';
            state.agents = sortAgents(state.agents);
            updateSortButtonsUI();
            renderAgents();
        });
        document.getElementById('sort-alpha-btn').addEventListener('click', () => {
            if (state.sortMode === 'alpha') {
                state.alphaSortDir = state.alphaSortDir === 'asc' ? 'desc' : 'asc';
            } else {
                state.sortMode = 'alpha';
                state.alphaSortDir = 'asc';
            }
            state.agents = sortAgents(state.agents);
            updateSortButtonsUI();
            renderAgents();
        });
        // ================================================================
        // Init
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('rc_token');
            const savedUserId = localStorage.getItem('rc_userId');
            const savedApiUrl = localStorage.getItem('rc_apiUrl');
            if (savedToken && savedUserId && savedApiUrl) {
                state.token = savedToken;
                state.userId = savedUserId;
                state.apiUrl = savedApiUrl;
                document.getElementById('api-url').value = savedApiUrl;
                showDashboard();
            }
        });
